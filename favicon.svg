<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033"/>
      <stop offset="100%" style="stop-color:#001a33"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F5FF"/>
      <stop offset="100%" style="stop-color:#FF00FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Hero silhouette -->
  <g transform="translate(256,280)">
    <!-- Body -->
    <rect x="-45" y="-30" width="90" height="110" rx="12" fill="none" stroke="url(#glow)" stroke-width="4"/>
    <!-- Head -->
    <circle cx="0" cy="-75" r="45" fill="none" stroke="url(#glow)" stroke-width="4"/>
    <!-- Eyes glow -->
    <circle cx="-15" cy="-78" r="6" fill="#00F5FF"/>
    <circle cx="15" cy="-78" r="6" fill="#FF00FF"/>
    <!-- Lightning bolt -->
    <path d="M-60,-140 L-10,-60 L-30,-60 L20,30" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
    <path d="M60,-140 L10,-60 L30,-60 L-20,30" fill="none" stroke="#FFD700" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <!-- Star on chest -->
    <polygon points="0,-10 6,5 20,5 9,14 12,28 0,20 -12,28 -9,14 -20,5 -6,5" fill="#FFD700" opacity="0.8"/>
  </g>
  <!-- Text "ГГ" -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="80" font-weight="bold" fill="#00F5FF" opacity="0.6">ГГ</text>
</svg>
